<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Camera Test</title>
  <style>
    body {
      margin: 0; padding: 16px; background: #111; color: #ddd;
      font-family: system-ui, sans-serif;
    }
    #bar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    select, button { padding: 6px 10px; background: #222; color: #ddd;
                     border: 1px solid #444; border-radius: 4px; }
    #status { font-size: 13px; color: #888; font-variant-numeric: tabular-nums; }
    canvas { border: 1px solid #333; display: block; max-width: 100%; }
  </style>
</head>
<body>
  <div id="bar">
    <select id="cams"></select>
    <span id="status">starting…</span>
  </div>

  <canvas id="out" width="640" height="480"></canvas>
  <video id="video" playsinline muted style="display:none"></video>
  <div id="bottom-bar">
    <span id = "hand"></span>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
